# Machine-readable source manifest. The orchestrator reasons from capabilities,
# not connector names. `enabled_by_default` is the competition default; ENABLE_*
# environment switches and API keys can turn optional sources on.
#
# Paid sources are not used: Proff → free official registers (app/connectors/capabilities.py);
# Doffin's subscription API → TED Search API + DFØ's open Doffin dataset.
#
# Permission basis follows the Builderr Signalpost source policy:
#  - official Norwegian registers and APIs are permitted;
#  - company-owned websites (verified to the exact legal entity) and profiles
#    linked from them are permitted, subject to robots.txt and rate limits;
#  - search APIs generate candidates only — never claim evidence;
#  - LinkedIn / Meta / Glassdoor / Indeed are NOT scraped; only links that a
#    verified company website publishes are recorded.
sources:
  - id: brreg_entity
    name: "Brønnøysundregistrene — Enhetsregisteret"
    category: norwegian_registry
    authority: primary
    source_class: official_registry_live
    access: official_api
    endpoint: "https://data.brreg.no/enhetsregisteret/api/enheter/{org}"
    licence: "NLOD 2.0"
    auth_required: false
    rate_limit: "polite; shared host concurrency 6"
    enabled_by_default: true
    capabilities: [identity, status, locations, website, history, contact]

  - id: brreg_bulk
    name: "Brønnøysundregistrene — Enhetsregisteret bulk snapshot"
    category: norwegian_registry
    authority: primary
    source_class: official_registry_bulk
    access: official_bulk_download
    endpoint: "https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv"
    licence: "NLOD 2.0"
    auth_required: false
    enabled_by_default: true
    capabilities: [identity, status]
    notes: "Optional --bulk frozen anchor; used when the live API is unavailable."

  - id: brreg_roles
    name: "Brønnøysundregistrene — roller"
    category: norwegian_registry
    authority: primary
    source_class: official_roles
    access: official_api
    endpoint: "https://data.brreg.no/enhetsregisteret/api/enheter/{org}/roller"
    licence: "NLOD 2.0"
    auth_required: false
    enabled_by_default: true
    capabilities: [leadership, people, ownership]
    notes: "Birth dates are discarded; people only in company-role context."

  - id: brreg_subunits
    name: "Brønnøysundregistrene — underenheter"
    category: norwegian_registry
    authority: primary
    source_class: official_subunits
    access: official_api
    endpoint: "https://data.brreg.no/enhetsregisteret/api/underenheter?overordnetEnhet={org}&size=1000"
    licence: "NLOD 2.0"
    auth_required: false
    enabled_by_default: true
    capabilities: [locations]

  - id: brreg_group
    name: "Brønnøysundregistrene — konsernstruktur"
    category: norwegian_registry
    authority: primary
    source_class: official_group_structure
    access: official_api
    endpoint: "https://data.brreg.no/enhetsregisteret/api/konsernstruktur/{org}"
    licence: "NLOD 2.0"
    auth_required: false
    enabled_by_default: true
    capabilities: [ownership]
    notes: "Only called when the entity reports erIKonsern=true."

  - id: brreg_accounts
    name: "Regnskapsregisteret"
    category: norwegian_registry
    authority: primary
    source_class: official_annual_accounts
    access: official_api
    endpoint: "https://data.brreg.no/regnskapsregisteret/regnskap/{org}"
    licence: "NLOD 2.0"
    auth_required: false
    enabled_by_default: true
    capabilities: [financials]

  - id: brreg_account_copies
    name: "Regnskapsregisteret — årsregnskap (kopi)"
    category: norwegian_registry
    authority: primary
    source_class: official_annual_account_copies
    access: official_api
    endpoint: "https://data.brreg.no/regnskapsregisteret/regnskap/aarsregnskap/kopi/{org}/aar"
    licence: "NLOD 2.0"
    auth_required: false
    rate_limit: "≈30 request starts per minute (spaced ≥2.1 s)"
    enabled_by_default: true
    capabilities: [financials, history]

  - id: company_website
    name: "Official company website"
    category: company_owned
    authority: primary
    source_class: company_owned
    access: http_fetch
    licence: "company-published; robots.txt respected"
    auth_required: false
    rate_limit: "max 2 concurrent requests per host; MAX_PAGES_PER_SITE pages"
    enabled_by_default: true
    capabilities: [website, business, contact, leadership, locations, jobs, public_activity]
    notes: "Content claims are published only after the website identity gate verifies the exact legal entity."

  - id: company_ats
    name: "Company-linked job board (ATS)"
    category: company_owned
    authority: primary
    source_class: company_linked_job_board
    access: http_fetch
    auth_required: false
    enabled_by_default: true
    capabilities: [jobs]
    notes: "Primary hiring source together with the careers page. Only ATS pages linked from the verified company website (or on the verified domain / a known job-board host and tied to the exact organisation) are visited; robots.txt is respected."

  - id: company_newsroom
    name: "Company newsroom, investor relations and RSS/Atom feeds"
    category: company_owned
    authority: primary
    source_class: company_owned
    access: http_fetch
    licence: "company-published; robots.txt respected"
    auth_required: false
    rate_limit: "shares the website budget: pages the crawl already read, up to NEWS_DISCOVERY_MAX_PAGES more, at most two same-site feeds"
    enabled_by_default: true
    capabilities: [news, public_activity]
    notes: "First stop for announcements, results, contracts and leadership changes. Only on an identity-verified website; a page that robots.txt disallows is recorded as blocked and never fetched; a script-rendered page is recorded as 'no dated items', never as 'no news'."

  - id: secondary_news
    name: "Reputable press and wire services (found by search)"
    category: secondary
    authority: secondary
    source_class: secondary_news
    access: http_fetch
    licence: "third-party articles: only the headline, date, link and a verbatim lead of at most 300 characters are stored; robots.txt respected"
    auth_required: true
    env: TAVILY_API_KEY
    enabled_by_default: true
    capabilities: [news, public_activity]
    notes: "Restricted to SECONDARY_NEWS_DOMAINS. Each article is fetched, dated and tied to the exact organisation (organisation number, or the exact registered name in the headline; a name that continues into a longer company name is rejected). Ranked below the company's own announcements."

  - id: tavily_search
    name: "Tavily Search API"
    category: discovery
    authority: discovery
    source_class: search_discovery
    access: api
    endpoint: "https://api.tavily.com/search"
    auth_required: true
    env: TAVILY_API_KEY
    cost: "free plan: 1,000 credits/month (basic search = 1 credit); pay-as-you-go ≈ USD 0.008 per credit"
    enabled_by_default: true
    capabilities: [discovery, website, news, jobs]
    notes: "Candidates only. A result is never claim evidence; the fetched page must pass the identity gate. For hiring: at most one search per company, only when the company's own careers sources show no current opening; hits are restricted to the verified domain and known job-board hosts, fetched with robots.txt respected, and used only after the employer is tied to the exact organisation and the posting is shown to be current."

  - id: norid
    name: "Norid RDAP"
    category: norwegian_registry
    authority: secondary
    source_class: domain_registry
    access: official_api
    endpoint: "https://rdap.norid.no/domain/{domain}"
    auth_required: false
    enabled_by_default: true
    capabilities: [website, identity]
    notes: "Identity signal only (holder organisation number when disclosed)."

  - id: geonorge
    name: "Kartverket / Geonorge address API"
    category: norwegian_registry
    authority: primary
    source_class: official_geodata
    access: official_api
    endpoint: "https://ws.geonorge.no/adresser/v1/sok"
    licence: "CC BY 4.0"
    auth_required: false
    enabled_by_default: true
    capabilities: [locations]
    notes: "Geocodes registered addresses for maps; not published as an evaluator claim."

  - id: ssb_classification
    name: "SSB — standard for counties (KLASS 104)"
    category: statistics
    authority: primary
    source_class: official_classification
    access: static_classification
    auth_required: false
    enabled_by_default: true
    capabilities: [locations]
    notes: "Municipality → county mapping from the first two digits of the municipality number (2024 county structure)."

  - id: proff
    name: "Proff.no API"
    category: business_database
    authority: secondary
    source_class: licensed_business_database
    access: not_used
    auth_required: true
    enabled_by_default: false
    capabilities: []
    notes: "Not used (paid licence). Its company-data capabilities are covered by Enhetsregisteret, Foretaksregisteret fields, the roles and sub-unit APIs and Regnskapsregisteret; shareholders and credit ratings have no free equivalent and stay unavailable. Map: app/connectors/capabilities.py."

  - id: doffin
    name: "Doffin public procurement API"
    category: procurement
    authority: primary
    source_class: official_procurement
    access: not_used
    auth_required: true
    enabled_by_default: false
    capabilities: []
    notes: "Not used (subscription key). Free alternatives: ted_search and doffin_open_data."

  - id: ted_search
    name: "TED Search API (Tenders Electronic Daily)"
    category: procurement
    authority: primary
    source_class: official_procurement_notice
    access: official_api
    endpoint: "https://api.ted.europa.eu/v3/notices/search"
    licence: "EU open data (reuse permitted)"
    auth_required: false
    rate_limit: "anonymous fair use per IP; COGNIS spaces calls ≥0.5 s"
    enabled_by_default: true
    capabilities: [procurement, public_activity]
    notes: "EU-published notices only (Norwegian above-threshold procurements); not complete Norwegian coverage. A notice is used only when the role's identifier states the exact organisation number."

  - id: doffin_open_data
    name: "Doffin open data (DFØ — kunngjøringer av offentlige anskaffelser)"
    category: procurement
    authority: primary
    source_class: official_procurement_notice
    access: official_bulk_download
    endpoint: "https://data.norge.no/datasets/a77b0408-85f9-3e12-8a66-8d500b492e9d"
    licence: "open licence (data.norge.no)"
    auth_required: false
    enabled_by_default: true
    capabilities: [procurement, public_activity]
    notes: "Yearly CSV files imported offline (scripts/import_doffin_open_data.py); facts carry the dataset period. Rows link to a company only through an organisation-number column."

  - id: regulatory_official
    name: "Official regulators and public notices (found by search)"
    category: regulatory
    authority: primary
    source_class: government_regulator
    access: http_fetch
    licence: "official public pages; robots.txt respected; only a short verbatim passage, the title, date and link are stored"
    auth_required: true
    env: TAVILY_API_KEY
    enabled_by_default: true
    capabilities: [regulation, public_activity]
    notes: "Discovery uses the existing free Tavily allowance (no paid usage is ever started); every page on the REGULATORY_DOMAINS allowlist is fetched by COGNIS itself and must name this exact organisation (organisation number, or the exact registered name). Stage is read from the page's own wording: proposal vs enacted, allegation vs decision. Patents, trademarks and designs are NOT read (see patentstyret) and are reported as unavailable."

  - id: patentstyret
    name: "Patentstyret open API"
    category: ip_registry
    authority: primary
    source_class: official_ip_registry
    access: api
    auth_required: true
    env: PATENTSTYRET_API_KEY
    enabled_by_default: false
    capabilities: [ip]
    notes: "Not used. The data API (developer.patentstyret.no) requires registering and requesting a subscription key, and the public search (search.patentstyret.no) is a script-driven app without a documented anonymous data endpoint. Patents, trademarks and designs are therefore reported as unavailable, never as none. See docs/SOURCE_ACCESS_AUDIT.md."

  - id: nav_jobs
    name: "NAV Arbeidsplassen stillingsfeed (pam-stilling-feed)"
    category: jobs
    authority: primary
    source_class: official_job_feed
    access: official_api
    endpoint: "https://pam-stilling-feed.nav.no/api/v1/feed"
    licence: "free; arbeidsplassen.nav.no/vilkar-api"
    auth_required: true
    env: NAV_FEED_TOKEN
    rate_limit: "COGNIS spaces calls ≥0.2 s; feed pages are synced incrementally"
    enabled_by_default: true
    capabilities: [jobs]
    notes: "Supplementary: a NAV timeout or refusal is reported as 'NAV unavailable' and never as 'no openings'; the NAV step is capped (NAV_STEP_TIMEOUT_SECONDS) and stops after repeated unreachable responses. Bearer token: NAV_FEED_TOKEN (free private token) or NAV's public token. Feed summaries are indexed locally; a full ad is re-read and published only when its employer resolves to the exact organisation (organisation number, registered establishment, register parent, or exact name + verified website/registered address). Inactive or deleted ads are removed; contact persons are never stored."

  - id: fakt
    name: "Fakt.no"
    category: jobs
    authority: secondary
    access: none
    auth_required: true
    cost: "API access needs a paid Business or Enterprise plan"
    enabled_by_default: false
    capabilities: [jobs]
    notes: "Not used and no API key is read: the paid plan is not worth it here. Hiring data comes from company careers pages, linked job boards, search-assisted discovery (verified) and NAV Arbeidsplassen."

  - id: linkedin
    name: "LinkedIn"
    category: social
    authority: secondary
    source_class: company_linked_social_profile
    access: none
    auth_required: true
    enabled_by_default: false
    capabilities: [people, jobs]
    notes: "Not scraped (terms). Only profile URLs linked from a verified company website are recorded."

  - id: skatteetaten
    name: "Skatteetaten — aksjonærregisteret"
    category: norwegian_registry
    authority: primary
    source_class: official_shareholder_register
    access: by_request
    auth_required: true
    enabled_by_default: false
    capabilities: [ownership]
    notes: "Available by formal request only (days); not a runtime dependency."

  - id: industry_registries
    name: "Sector registries (Finanstilsynet, Sjøfartsdirektoratet, Fiskeridirektoratet, NVE, Nkom, …)"
    category: sector_registry
    authority: primary
    source_class: official_sector_registry
    access: router
    auth_required: false
    enabled_by_default: false
    capabilities: [industry]
    notes: "NACE-based router decides applicability; sector connectors stay disabled until each access path is reviewed."
